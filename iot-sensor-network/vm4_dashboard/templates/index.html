<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IoT Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    .header {
      display: flex; align-items: center; justify-content: center;
      gap: 15px; margin-bottom: 40px; position: relative;
    }
    h1 {
      color: white; text-align: center; font-size: 2.5em;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }
    .status-dot {
      width: 16px; height: 16px; border-radius: 50%; background: #ccc;
      box-shadow: 0 0 10px rgba(0,0,0,0.3); transition: all 0.3s ease;
      position: absolute; right: 0; top: 50%; transform: translateY(-50%);
    }
    .status-dot.connected { background: #28a745; box-shadow: 0 0 15px #28a745; animation: pulse 2s infinite; }
    .status-dot.error { background: #dc3545; box-shadow: 0 0 15px #dc3545; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

    .latest-readings {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px; margin-bottom: 30px;
    }
    .reading-card {
      background: white; border-radius: 15px; padding: 30px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center;
      transition: transform 0.3s ease; position: relative;
    }
    .reading-card:hover { transform: translateY(-5px); box-shadow: 0 6px 12px rgba(0,0,0,0.15); }
    .reading-card.alert { border: 3px solid #dc3545; animation: alertPulse 2s infinite; }
    @keyframes alertPulse {
      0%, 100% { box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
      50% { box-shadow: 0 4px 20px rgba(220,53,69,0.5); }
    }
    .alert-badge {
      position: absolute; top: 10px; right: 10px; background: #dc3545;
      color: white; padding: 5px 10px; border-radius: 20px; font-size: 0.8em;
      font-weight: bold; display: none; animation: shake 0.5s infinite;
    }
    .reading-card.alert .alert-badge { display: block; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }
    .temperature-card { border-top: 4px solid #ff6384; }
    .humidity-card { border-top: 4px solid #36a2eb; }
    .reading-icon { font-size: 3em; margin-bottom: 10px; }
    .reading-label { font-size: 1.1em; color: #666; margin-bottom: 10px; }
    .reading-value { font-size: 3em; font-weight: bold; color: #333; margin-bottom: 5px; }
    .reading-unit { font-size: 1.2em; color: #888; margin-bottom: 10px; }
    .reading-time { font-size: 0.9em; color: #999; font-style: italic; }

    .chart-container {
      background: white; border-radius: 15px; padding: 25px;
      margin-bottom: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .chart-title { font-size: 1.5em; margin-bottom: 20px; color: #333; display: flex; align-items: center; gap: 10px; }
    canvas { max-height: 300px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>IoT Sensor Dashboard</h1>
      <div id="statusIndicator" class="status-dot"></div>
    </div>

    <div class="latest-readings">
      <div class="reading-card temperature-card" id="tempCard">
        <span class="alert-badge">⚠ HIGH</span>
        <div class="reading-icon">🌡️</div>
        <div class="reading-label">Temperature</div>
        <div class="reading-value" id="latestTemp">--</div>
        <div class="reading-unit" id="tempUnit">°C</div>
        <div class="reading-time" id="tempTime">--</div>
      </div>
      <div class="reading-card humidity-card" id="humidityCard">
        <span class="alert-badge">⚠ HIGH</span>
        <div class="reading-icon">💧</div>
        <div class="reading-label">Humidity</div>
        <div class="reading-value" id="latestHumidity">--</div>
        <div class="reading-unit" id="humidityUnit">%</div>
        <div class="reading-time" id="humidityTime">--</div>
      </div>
    </div>

    <div class="chart-container">
      <h2 class="chart-title">🌡️ Temperature History</h2>
      <canvas id="temperatureChart"></canvas>
    </div>

    <div class="chart-container">
      <h2 class="chart-title">💧 Humidity History</h2>
      <canvas id="humidityChart"></canvas>
    </div>
  </div>

  <script>
    let temperatureChart, humidityChart;
    let thresholds = { temperature: 28, humidity: 70 };

    function initCharts() {
      const tempCtx = document.getElementById('temperatureChart').getContext('2d');
      const humCtx = document.getElementById('humidityChart').getContext('2d');
      const chartConfig = {
        type: 'line',
        options: {
          responsive: true,
          maintainAspectRatio: true,
          animation: { duration: 750 },
          plugins: { legend: { display: true, position: 'top' } },
          scales: {
            x: { title: { display: true, text: 'Time' } },
            y: { title: { display: true, text: 'Value' }, beginAtZero: false }
          }
        }
      };
      temperatureChart = new Chart(tempCtx, {
        ...chartConfig,
        data: {
          labels: [],
          datasets: [{
            label: 'Temperature (°C)',
            data: [],
            borderColor: 'rgb(255, 99, 132)',
            backgroundColor: 'rgba(255, 99, 132, 0.1)',
            tension: 0.4
          }]
        }
      });
      humidityChart = new Chart(humCtx, {
        ...chartConfig,
        data: {
          labels: [],
          datasets: [{
            label: 'Humidity (%)',
            data: [],
            borderColor: 'rgb(54, 162, 235)',
            backgroundColor: 'rgba(54, 162, 235, 0.1)',
            tension: 0.4
          }]
        }
      });
    }

    async function updateTemperature() {
      try {
        const response = await fetch(`/api/history/temperature?t=${Date.now()}`);
        const data = await response.json();
        if (data && data.length > 0) {
          temperatureChart.data.labels = data.map(item => new Date(item.timestamp).toLocaleTimeString());
          temperatureChart.data.datasets[0].data = data.map(item => parseFloat(item.value));
          temperatureChart.update('none');
        }
      } catch (error) {
        console.error('Error fetching temperature:', error);
      }
    }

    async function updateHumidity() {
      try {
        const response = await fetch(`/api/history/humidity?t=${Date.now()}`);
        const data = await response.json();
        if (data && data.length > 0) {
          humidityChart.data.labels = data.map(item => new Date(item.timestamp).toLocaleTimeString());
          humidityChart.data.datasets[0].data = data.map(item => parseFloat(item.value));
          humidityChart.update('none');
        }
      } catch (error) {
        console.error('Error fetching humidity:', error);
      }
    }

    async function updateLatestReadings() {
      try {
        const response = await fetch(`/api/latest?t=${Date.now()}`);
        const data = await response.json();
        if (data && data.length > 0) {
          const tempReading = data.find(item => item.type === 'temperature');
          const humidityReading = data.find(item => item.type === 'humidity');
          if (tempReading) {
            const tempValue = parseFloat(tempReading.value);
            document.getElementById('latestTemp').textContent = tempValue.toFixed(1);
            document.getElementById('tempUnit').textContent = tempReading.unit || '°C';
            document.getElementById('tempTime').textContent = `Updated: ${new Date(tempReading.timestamp).toLocaleTimeString()}`;
            document.getElementById('tempCard').classList.toggle('alert', tempValue >= thresholds.temperature);
          }
          if (humidityReading) {
            const humidityValue = parseFloat(humidityReading.value);
            document.getElementById('latestHumidity').textContent = humidityValue.toFixed(1);
            document.getElementById('humidityUnit').textContent = humidityReading.unit || '%';
            document.getElementById('humidityTime').textContent = `Updated: ${new Date(humidityReading.timestamp).toLocaleTimeString()}`;
            document.getElementById('humidityCard').classList.toggle('alert', humidityValue >= thresholds.humidity);
          }
        }
      } catch (error) {
        console.error('Error fetching latest readings:', error);
      }
    }

    async function checkHealth() {
      try {
        const response = await fetch('/api/health');
        const data = await response.json();
        const statusDot = document.getElementById('statusIndicator');
        if (data.iot_server === 'connected') {
          statusDot.className = 'status-dot connected';
          statusDot.title = 'Connected to IoT Server';
        } else {
          statusDot.className = 'status-dot error';
          statusDot.title = 'IoT Server Disconnected';
        }
      } catch (error) {
        document.getElementById('statusIndicator').className = 'status-dot error';
      }
    }

    async function fetchThresholds() {
      try {
        const response = await fetch('/api/thresholds');
        thresholds = await response.json();
      } catch (error) {
        console.error('Error fetching thresholds:', error);
      }
    }

    document.addEventListener('DOMContentLoaded', function () {
      initCharts();
      fetchThresholds();
      checkHealth();
      updateLatestReadings();
      updateTemperature();
      updateHumidity();

      setInterval(() => {
        updateLatestReadings();
        updateTemperature();
        updateHumidity();
        checkHealth();
      }, 3000);
    });
  </script>
</body>
</html>
